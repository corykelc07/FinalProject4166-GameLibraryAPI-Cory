openapi: 3.1.0

info:
  title: Game Library API
  version: 1.0.0
  description: An API for managing a game library with  games, reviews, comments, and authorization.

servers:
  - url: http://localhost:3000/api
    description: Local development server

tags:
  - name: Authentication
    description: Endpoints for user registration and login
  - name: Games
    description: Endpoints for managing games in the library
  - name: Reviews
    description: Endpoints for managing reviews of games
  - name: Comments
    description: Endpoints for managing comments on reviews


paths:
  /auth/signup:
    post:
      tags: [Authentication]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupInput'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errors:
                  - Email is required
                  - Password is required

        '409':
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Email already in use

  /auth/login:
    post:
      tags: [Authentication]
      summary: Log in an existing user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: User logged in successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errors:
                  - Email is required
                  - Password is required
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Invalid credentials
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Too many requests

  /games:
    get:
      summary: Retrieve a list of games
      description: Retrieve games with optional search, sorting, and pagination.
      tags: [Games]
      parameters:
        - name: search
          in: query
          required: false
          description: Search by title, genre, or developer.
          schema:
            type: string
          example: RPG
        - name: sortBy
          in: query
          required: false
          description: Field used to sort games.
          schema:
            type: string
            enum: [id, title, genre, releaseDate, developer]
            default: id
          example: title
        - name: order
          in: query
          required: false
          description: Sort order.
          schema:
            type: string
            enum: [asc, desc]
            default: asc
          example: asc
        - name: offset
          in: query
          required: false
          description: Number of games to skip.
          schema:
            type: integer
            minimum: 0
            default: 0
          example: 0
        - name: limit
          in: query
          required: false
          description: Maximum number of games to return.
          schema:
            type: integer
            minimum: 1
            default: 5
          example: 5
      responses:
        '200':
          description: A list of games
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Game'
              examples:
                games:
                  value:
                    - id: 3
                      title: Elden Ring
                      genre: Action RPG
                      releaseDate: '2022-02-25T00:00:00.000Z'
                      developer: FromSoftware
                    - id: 5
                      title: Test Game
                      genre: RPG
                      releaseDate: '2024-01-01T00:00:00.000Z'
                      developer: Test Studio
        '400':
          description: Bad request due to invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errors:
                  - sortBy must be one of id, title, genre, releaseDate, developer
    post:
      summary: Create a new game
      description: Create a new game. Admin access required.
      tags: [Games]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGameInput'
            example:
              title: Test Game
              genre: RPG
              releaseDate: '2024-01-01'
              developer: Test Studio
      responses:
        '201':
          description: Game created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errors:
                  - Title is required
                  - Genre is required
                  - Release date is required
                  - Developer is required
        '401':
          description: Unauthorized - missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Authentication required
        '403':
          description: Forbidden - admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Forbidden: insufficient permission"
        '409':
          description: Game title already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Game title already exists


  /games/{id}:
    get:
      tags: [Games]
      summary: Retrieve a single game by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
          description: Unique identifier for the game
      responses:
        '200':
          description: Game retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '400':
            description: Validation error
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ErrorResponse'
                example:
                  error: Id must be a positive integer
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Id not found

    put:
        summary: Update a game by ID
        description: Update game details. Admin access required.
        tags: [Games]
        security:
          - bearerAuth: []
        parameters:
          - $ref: '#/components/parameters/IdParam'
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateGameInput'
              example:
                title: Updated Game Title
                genre: Action RPG
                releaseDate: '2024-01-01'
                developer: Updated Studio
        responses:
          '200':
            description: Game updated successfully
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Game'


      '400':
        description: Validation error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
            example:
              errors:
                - Title must be at least 5 characters

      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
            example:
              error: Authentication required

      '403':
        description: Admin access required
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
            example:
              error: "Forbidden: insufficient permission"

      '404':
        description: Game not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
            example:
              error: Game not found

      '409':
        description: Game title already exists
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
            example:
              error: Game title already exists

    delete:
      summary: Delete a game by ID
      description: Delete a game. Admin access required.
      tags: [Games]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '204':
          description: Game deleted successfully

      '400':
        description: Invalid ID
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
            example:
              errors:
                - ID must be a positive integer

      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
            example:
              error: Authentication required

      '403':
        description: Admin access required
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
            example:
              error: "Forbidden: insufficient permission"

      '404':
        description: Game not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
            example:
              error: Game not found

  
  /reviews:
    get:
      summary: Retrieve a list of reviews
      tags: [Reviews]
      responses:
        '200':
          description: A list of reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Review'

    post:
      summary: Create a new review
      description: Create a review for an existing game. Authentication required.
      tags: [Reviews]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewInput'
            example:
              title: Great game
              content: I really enjoyed the combat and exploration.
              rating: 5
              gameId: 1
      responses:
        '201':
          description: Review created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'


        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errors:
                  - Title is required
                  - Content is required
                  - Rating is required
                  - Game ID is required

        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Authentication required

        '404':
          description: Game not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Game not found

  /reviews/{id}:
    get:
      summary: Retrieve a review by ID
      tags: [Reviews]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Review retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          description: Invalid ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errors:
                  - ID must be a positive integer

        '404':
          description: Review not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Review not found


    put:
      summary: Update a review by ID
      description: Update a review. Review owner or admin access required.
      tags: [Reviews]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReviewInput'
            example:
              title: Updated review title
              content: Updated review content.
              rating: 4
      responses:
        '200':
          description: Review updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errors:
                  - Content must be at least 3 characters

        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Authentication required

        '403':
          description: Insufficient Permissions to modify this review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "You do not have permission to perform this action"

        '404':
          description: Review not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Review not found



    delete:
      summary: Delete a review by ID
      description: Delete a review. Review owner or admin access required.
      tags: [Reviews]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '204':
          description: Review deleted successfully
        '400':
            description: Invalid ID
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ErrorResponse'
                example:
                  errors:
                    - ID must be a positive integer

          '401':
            description: Unauthorized
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ErrorResponse'
                example:
                  error: Authentication required

          '403':
            description: Insufficient Permissions to delete this review
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ErrorResponse'
                example:
                  error: "You do not have permission to perform this action"

          '404':
            description: Review not found
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ErrorResponse'
                example:
                  error: Review not found
  
  /comments:
    get:
      summary: Retrieve a list of comments
      tags: [Comments]
      responses:
        '200':
          description: A list of comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'
    post:
      summary: Create a new comment
      description: Create a comment for an existing review. Authentication required.
      tags: [Comments]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentInput'
            example:
              content: I agree with this review.
              reviewId: 1
      responses:
        '201':
          description: Comment created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
            description: Validation error
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ErrorResponse'
                example:
                  errors:
                    - Content is required
                    - Review ID is required

          '401':
            description: Unauthorized
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ErrorResponse'
                example:
                  error: Authentication required

          '404':
            description: Review not found
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ErrorResponse'
                example:
                  error: Review not found

  /comments/{id}:
    get:
      summary: Retrieve a comment by ID
      tags: [Comments]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Comment retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
            description: Invalid ID
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ErrorResponse'
                example:
                  errors:
                    - ID must be a positive integer

          '404':
            description: Comment not found
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ErrorResponse'
                example:
                  error: Comment not found

    put:
      summary: Update a comment by ID
      description: Update a comment. Comment owner or admin access required.
      tags: [Comments]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCommentInput'
            example:
              content: Updated comment content.
      responses:
        '200':
          description: Comment updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errors:
                  - Content must be at least 3 characters

        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Authentication required

        '403':
          description: Insufficient Permissions to modify this comment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "You do not have permission to perform this action"

        '404':
          description: Comment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Comment not found

    delete:
      summary: Delete a comment by ID
      description: Delete a comment. Comment owner or admin access required.
      tags: [Comments]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '204':
          description: Comment deleted successfully
        '400':
          description: Invalid ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errors:
                  - ID must be a positive integer

        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Authentication required

        '403':
          description: Insufficient Permissions to delete this comment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "You do not have permission to perform this action"

        '404':
          description: Comment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Comment not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      description: Positive integer ID
      schema:
        type: integer
        minimum: 1

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        errors:
          type: array
          items:
            type: string


    User:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier for the user
          example: 1
        email:
          type: string
          format: email
          description: User email address
          example: jane@test.com
        role:
          type: string
          description: User authorization role
          enum: [USER, ADMIN]
          example: USER

    SignupInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: newuser@test.com
        password:
          type: string
          minLength: 5
          example: password123

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: jane@test.com
        password:
          type: string
          example: jane1234

    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT used for authenticated requests
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: '#/components/schemas/User'

    Game:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier for the game
          example: 1
        title:
          type: string
          minLength: 5
          description: Title of the game
          example: The Legend of Zelda Breath of the Wild
        genre:
          type: string
          minLength: 3
          description: Genre of the game
          example: Action-Adventure
        releaseDate:
          type: string
          format: date-time
          description: Release date of the game
          example: '2017-03-03T00:00:00.000Z'
        developer:
          type: string
          minLength: 3
          description: Developer of the game
          example: Nintendo
      required: [title, genre, releaseDate, developer]

    CreateGameInput:
      type: object
      required: [title, genre, releaseDate, developer]
      properties:
        title:
          type: string
          minLength: 5
          example: Test Game
        genre:
          type: string
          minLength: 3
          example: RPG
        releaseDate:
          type: string
          format: date
          example: '2024-01-01'
        developer:
          type: string
          minLength: 3
          example: Test Studio

    UpdateGameInput:
      type: object
      properties:
        title:
          type: string
          minLength: 5
          example: Updated Game Title
        genre:
          type: string
          minLength: 3
          example: Action RPG
        releaseDate:
          type: string
          format: date
          example: '2024-01-01'
        developer:
          type: string
          minLength: 3
          example: Updated Studio

    Review:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier for the review
          example: 1
        title:
          type: string
          minLength: 3
          description: Review title
          example: Great game
        content:
          type: string
          minLength: 3
          description: Review body content
          example: I really enjoyed the combat and world design.
        rating:
          type: integer
          minimum: 1
          maximum: 5
          description: Numeric rating for the game
          example: 5
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the review was created
          example: '2024-01-01T00:00:00.000Z'
        authorId:
          type: integer
          description: ID of the user who wrote the review
          example: 1
        gameId:
          type: integer
          description: ID of the game being reviewed
          example: 1

    CreateReviewInput:
      type: object
      required: [title, content, rating, gameId]
      properties:
        title:
          type: string
          minLength: 3
          example: Great game
        content:
          type: string
          minLength: 3
          example: I really enjoyed this game.
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        gameId:
          type: integer
          minimum: 1
          example: 1

    UpdateReviewInput:
      type: object
      properties:
        title:
          type: string
          minLength: 3
          example: Updated review title
        content:
          type: string
          minLength: 3
          example: Updated review content.
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 4

    Comment:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier for the comment
          example: 1
        content:
          type: string
          minLength: 3
          description: Comment body content
          example: I agree with this review.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the comment was created
          example: '2024-01-01T00:00:00.000Z'
        authorId:
          type: integer
          description: ID of the user who wrote the comment
          example: 1
        reviewId:
          type: integer
          description: ID of the review being commented on
          example: 1

    CreateCommentInput:
      type: object
      required: [content, reviewId]
      properties:
        content:
          type: string
          minLength: 3
          example: I agree with this review.
        reviewId:
          type: integer
          minimum: 1
          example: 1

    UpdateCommentInput:
      type: object
      properties:
        content:
          type: string
          minLength: 3
          example: Updated comment content.